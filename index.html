<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kids Numbers Game</title>
  <style>
    /* Base (mobile-first) styles */
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 16px;
      background: #f5f7ff;
    }

    #game-container {
      max-width: 480px; /* fits phones, small tablets */
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 6vw; /* scales with screen width */
      margin-bottom: 16px;
    }

    #question {
      font-size: 5vw;
      margin: 16px 0;
    }

    #answer {
      font-size: 5vw;
      padding: 10px;
      width: 80%;
      max-width: 280px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      display: inline-block;
      margin: 8px;
      padding: 12px 20px;
      font-size: 4.5vw;
      min-height: 48px;
      min-width: 120px;
      border-radius: 999px;
      border: none;
      color: #fff;
      background: #4a90e2;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    #result {
      font-size: 4.5vw;
      margin-top: 12px;
    }

    .correct {
      color: #1b9c43;
    }

    .wrong {
      color: #d0021b;
    }

    /* Timer styles */
    .timer-container {
      margin-top: 12px;
      font-size: 4.5vw;
      color: #333;
    }

    /* For very small phones */
    @media (max-width: 360px) {
      h1 { font-size: 7vw; }
      #question { font-size: 6vw; }
      #answer { font-size: 6vw; }
      button { font-size: 5vw; }
      #result { font-size: 5vw; }
      .timer-container { font-size: 5vw; }
    }

    /* For tablets and desktops: make text a bit more "normal" size */
    @media (min-width: 768px) {
      body {
        padding: 32px;
      }
      #game-container {
        max-width: 600px; /* wider on desktop/tablet */
      }
      h1 {
        font-size: 32px; /* fixed size for large screens */
      }
      #question {
        font-size: 24px;
      }
      #answer {
        font-size: 22px;
      }
      button {
        font-size: 18px;
        min-width: 140px;
      }
      #result {
        font-size: 20px;
      }
      .timer-container {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h1>Before, After &amp; Between</h1>

    <div id="question"></div>

    <input id="answer" type="number" inputmode="numeric" placeholder="Type your answer">

    <div>
      <button id="checkBtn">Check</button>
      <button id="nextBtn">Next</button>
    </div>

    <div id="result"></div>

    <!-- Stopwatch display -->
    <div class="timer-container">
      Time: <span id="question-timer">00:00</span>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
