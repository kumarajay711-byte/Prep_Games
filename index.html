<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids Learning Games</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#4facfe,#00f2fe);transition:.3s}.app{width:min(1050px,100%);padding:24px;background:#0003;border-radius:24px}.screen{display:none}.active{display:block}.head{text-align:center}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:25px}.choice{padding:20px 10px;border:0;border-radius:18px;background:#fff;color:#234;cursor:pointer;box-shadow:0 6px 12px #0003}.icon{font-size:3rem}.panel{text-align:center;background:#ffffff20;border-radius:18px;padding:24px}.back,.btn{padding:11px 20px;border:0;border-radius:999px;font-weight:bold;cursor:pointer}.back{float:left;background:#fff;color:#333}.btn{margin:7px;background:#ffcb3b}.secondary{background:#fff}.display{clear:both;padding-top:16px;font-size:clamp(2rem,6vw,3.4rem);font-weight:bold}.question{font-size:2rem;margin:22px;word-wrap:break-word}input{width:170px;padding:12px;border:0;border-radius:10px;font-size:1.1rem;text-align:center}.sign{font-size:2rem;width:100px}.objects{min-height:160px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:18px;border:3px dashed #fff9;border-radius:15px}.object{font-size:clamp(2rem,7vw,4rem)}.math-question{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:20px 0}.math-group{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;min-width:125px;max-width:280px;min-height:78px;padding:13px;background:#fffffff2;border:4px solid #ffcb3b;border-radius:15px;color:#234;font-size:2.2rem}.math-sign{font-size:2.4rem;font-weight:bold;margin:0 3px}.options{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}.option{text-transform:uppercase;min-width:130px;padding:14px;border:0;border-radius:14px;background:#fff;color:#234;font-weight:bold;cursor:pointer}.feedback{min-hei </style></head><body><main class="app"><section id="home" class="screen active"><header class="head"><h1>🎓 Kids Learning Games</h1><p>Choose a game to start!</p></header><div class="choices"><button class="choice" onclick="openGame('count')"><div class="icon">🍎</div><h2>Count Objects</h2><p>Count from 1 to 20.</p></button><button class="choice" onclick="openGame('before')"><div class="icon">🔢</div><h2>Before, After & Between</h2><p>Find the missing number.</p></button><button class="choice" onclick="openGame('words')"><div class="icon">🔤</div><h2>Number Words</h2><p>Choose the English name.</p></button><button class="choice" onclick="openGame('compare')"><div class="icon">⚖️</div><h2>Compare Numbers</h2><p>Enter &gt;, &lt; or =.</p></button><button class="choice" onclick="openGame('math')"><div class="icon">➕➖</div><h2>Object Math</h2><p>Add or subtract objects.</p></button></div></section>
<section id="count" class="screen"><div class="panel"><button class="back" onclick="home()">← Games</button><div class="display">🎯 Count Objects</div><p>Count and enter the number.</p><div id="objects" class="objects"></div><input id="countInput" type="number" min="1" max="20" placeholder="Answer"><br><button class="btn" onclick="checkCount()">Check</button><button class="btn secondary" onclick="newCount()">New Task</button><p id="countFeedback" class="feedback"></p><div id="countStats" class="stats"></div></div></section>
<section id="before" class="screen"><div class="panel"><button class="back" onclick="home()">← Games</button><div id="beforeTitle" class="display"></div><div class="question"><span id="left">?</span> ➜ <span id="middle"></span> ➜ <span id="right">?</span></div><input id="beforeInput" type="number" min="1" max="100" placeholder="Answer"><br><button class="btn" onclick="checkBefore()">Check</button><button class="btn secondary" onclick="newBefore()">New Question</button><p id="beforeFeedback" class="feedback"></p><div id="beforeStats" class="stats"></div></div></section>

<section id="math" class="screen"><div class="panel"><button class="back" onclick="home()">← Games</button><div class="display">➕➖ Object Math</div><p>Count both boxes and solve the question.</p><div id="mathQuestion" class="math-question"></div><input id="mathInput" type="number" min="0" placeholder="Answer"><br><button class="btn" onclick="checkMath()">Check</button><button class="btn secondary" onclick="newMath()">New Question</button><p id="mathFeedback" class="feedback"></p><div id="mathStats" class="stats"></div></div></section></main><script>

const names=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty','twenty-one','twenty-two','twenty-three','twenty-four','twenty-five','twenty-six','twenty-seven','twenty-eight','twenty-nine','thirty','thirty-one','thirty-two','thirty-three','thirty-four','thirty-five','thirty-six','thirty-seven','thirty-eight','thirty-nine','forty','forty-one','forty-two','forty-three','forty-four','forty-five','forty-six','forty-seven','forty-eight','forty-nine','fifty'];let wn=0,wr=0,wt=0,wd=false;function newWords(){wd=false;wn=Math.floor(Math.random()*50)+1;$('shown').textContent=wn;let c=[names[wn]],u=new Set([wn]);while(c.length<3){let n=Math.floor(Math.random()*50)+1;if(!u.has(n)){u.add(n);c.push(names[n])}}c.sort(()=>Math.random()-.5);$('options').innerHTML=c.map(x=>`<button class="option" onclick="checkWords(this)">${x}</button>`).join('');$('wordFeedback').textContent='Choose one answer.';$('wordStats').innerHTML=stat(wr,wt)}function checkWords(b){if(wd)return;wd=true;wt++;let ok=b.textContent===names[wn];if(ok){wr++;b.style.background='#8cff9b';$('wordFeedback').textContent='Correct! 🎉'}else{$('wordFeedback').textContent='Correct answer: '+names[wn];b.style.background='#ff8c8c'}result(ok);$('wordStats').innerHTML=stat(wr,wt)}
