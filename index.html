<!DOCTYPE html>
<html>
<head>
  <title>Kids Numbers Game</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    #question { font-size: 24px; margin: 20px; }
    #result { font-size: 20px; margin: 10px; }
    .correct { color: green; }
    .wrong { color: red; }
  </style>
</head>
<body>
  <h1>Before, After & Between</h1>

  <p id="question"></p>

  <input id="answer" type="number" placeholder="Type your answer">
  <br><br>
  <button id="checkBtn">Check Answer</button>
  <button id="nextBtn">Next Question</button>

  <p id="result"></p>

  <script src="game.js"></script>
</body>
</html>
