<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kids Numbers Game – Before / After / Between</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      color: #fff;
    }

    .app-container {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 1.5rem;
      max-width: 900px;
      width: 100%;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1rem;
      opacity: 0.85;
    }

    /* Layout: mobile-first (single column) */
    .layout {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .game-panel {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .number-display {
      font-size: 3rem;
      font-weight: 700;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.2);
      text-align: center;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

    .btn {
      border: none;
      cursor: pointer;
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
      border-radius: 999px;
      background: #ffcb3b;
      color: #333;
      font-weight: 600;
      min-width: 120px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .btn-secondary {
      background: #ffffff;
      color: #333;
    }

    .stats-panel {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-size: 0.95rem;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stats-label {
      opacity: 0.9;
      font-weight: 500;
    }

    .stats-value {
      font-weight: 700;
    }

    .footer-note {
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    /* Tablet and small desktop: two columns */
    @media (min-width: 768px) {
      .app-container {
        padding: 2rem;
      }

      .header h1 {
        font-size: 2.4rem;
      }

      .header p {
        font-size: 1.1rem;
      }

      .layout {
        flex-direction: row;
        align-items: stretch;
      }

      .game-panel {
        flex: 2;
      }

      .stats-panel {
        flex: 1;
      }
    }

    /* Large desktop: bigger text and spacing */
    @media (min-width: 1200px) {
      .app-container {
        max-width: 1100px;
      }

      .number-display {
        font-size: 3.4rem;
      }

      .btn {
        font-size: 1.2rem;
        padding: 1rem 1.75rem;
      }

      .stats-panel {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>Kids Numbers Game</h1>
      <p>Learn BEFORE, AFTER and BETWEEN numbers!</p>
    </header>

    <main class="layout">
      <!-- Game area -->
      <section class="game-panel">
        <div class="number-display" id="questionTitle">
          Before / After / Between
        </div>

        <div
          id="questionArea"
          style="text-align: center; font-size: 1.6rem; margin-top: 1rem;"
        >
          <!-- Example (Before): ? ➜ 18, (After): 18 ➜ ?, (Between): 12 ➜ 14 -->
          <span id="leftNumber">?</span>
          <span style="margin: 0 0.75rem;">➜</span>
          <span id="rightNumber">18</span>
        </div>

        <div class="controls" style="margin-top: 1.25rem;">
          <input
            id="answerInput"
            type="number"
            placeholder="Type your answer"
            style="
              padding: 0.6rem 0.9rem;
              font-size: 1.1rem;
              border-radius: 0.75rem;
              border: none;
              min-width: 160px;
            "
          />
          <button id="checkBtn" class="btn">Check</button>
          <button id="newQuestionBtn" class="btn btn-secondary">New Question</button>
        </div>

        <div id="feedback" style="margin-top: 0.85rem; font-size: 1.1rem;">
          Let’s start! Fill the missing number.
        </div>
      </section>

      <!-- Stats area -->
      <aside class="stats-panel">
        <div class="stats-row">
          <span class="stats-label">Mode</span>
          <span id="modeLabel" class="stats-value">Between</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Correct answers</span>
          <span id="correctCount" class="stats-value">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Total questions</span>
          <span id="totalCount" class="stats-value">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Score</span>
          <span id="scoreLabel" class="stats-value">0%</span>
        </div>
      </aside>
    </main>

    <div class="footer-note">
      Made with ❤️ for kids learning numbers (Before, After & Between).
    </div>
  </div>

  <!-- Game logic inline -->
  <script>
    (function () {
      const MIN_NUMBER = 1;
      const MAX_NUMBER = 100; // Change if you want smaller range

      const questionTitle = document.getElementById('questionTitle');
      const leftNumberEl = document.getElementById('leftNumber');
      const rightNumberEl = document.getElementById('rightNumber');
      const answerInput = document.getElementById('answerInput');
      const feedbackEl = document.getElementById('feedback');

      const checkBtn = document.getElementById('checkBtn');
      const newQuestionBtn = document.getElementById('newQuestionBtn');

      const modeLabel = document.getElementById('modeLabel');
      const correctCountEl = document.getElementById('correctCount');
      const totalCountEl = document.getElementById('totalCount');
      const scoreLabel = document.getElementById('scoreLabel');

      const MODES = ['Before', 'After', 'Between'];
      let currentMode = 'Between';
      let correctAnswer = null;
      let correctCount = 0;
      let totalCount = 0;

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function pickMode() {
        const index = randomInt(0, MODES.length - 1);
        currentMode = MODES[index];
        modeLabel.textContent = currentMode;
      }

      function makeQuestion() {
        pickMode();
        const n = randomInt(MIN_NUMBER + 2, MAX_NUMBER - 2);

        let titleText = '';
        let helperText = '';

        if (currentMode === 'Before') {
          // ? ➜ n
          leftNumberEl.textContent = '?';
          rightNumberEl.textContent = String(n);
          correctAnswer = n - 1;
          titleText = 'What number comes BEFORE?';
          helperText = 'Type the number that comes just before the right number.';
        } else if (currentMode === 'After') {
          // n ➜ ?
          leftNumberEl.textContent = String(n);
          rightNumberEl.textContent = '?';
          correctAnswer = n + 1;
          titleText = 'What number comes AFTER?';
          helperText = 'Type the number that comes just after the left number.';
        } else {
          // Between: show two numbers; kid types middle number
          // Example: 12 ➜ 14, answer is 13
          leftNumberEl.textContent = String(n - 1);
          rightNumberEl.textContent = String(n + 1);
          correctAnswer = n;
          titleText = 'What number comes BETWEEN?';
          helperText =
            'Type the number that lies between the two numbers (middle number).';
        }

        questionTitle.textContent = titleText;
        feedbackEl.textContent = helperText;
        feedbackEl.style.color = '#ffffff';

        answerInput.value = '';
        answerInput.focus();
      }

      function updateStats() {
        correctCountEl.textContent = String(correctCount);
        totalCountEl.textContent = String(totalCount);
        const score = totalCount === 0 ? 0 : Math.round((correctCount / totalCount) * 100);
        scoreLabel.textContent = score + '%';
      }

      function checkAnswer() {
        const value = answerInput.value.trim();
        if (value === '') {
          feedbackEl.textContent = 'Type a number to check!';
          feedbackEl.style.color = '#ffeb3b';
          return;
        }

        const userNumber = parseInt(value, 10);
        totalCount += 1;

        if (userNumber === correctAnswer) {
          correctCount += 1;
          feedbackEl.textContent = 'Great job! That is correct ✅';
          feedbackEl.style.color = '#00ffb0';
        } else {
          feedbackEl.textContent =
            'Oops! Try again. The correct answer is ' + correctAnswer + '.';
          feedbackEl.style.color = '#ff5252';
        }

        updateStats();
      }

      checkBtn.addEventListener('click', checkAnswer);
      newQuestionBtn.addEventListener('click', function () {
        makeQuestion();
      });

      answerInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          checkAnswer();
        }
      });

      makeQuestion();
      updateStats();
    })();
  </script>
</body>
</html>
