
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids Learning Games</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#4facfe,#00f2fe);transition:.3s}.app{width:min(1050px,100%);padding:24px;background:#0003;border-radius:24px;box-shadow:0 12px 30px #0004}.screen{display:none}.screen.active{display:block}.head{text-align:center}.head h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 8px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-top:25px}.choice{padding:20px 10px;border:0;border-radius:18px;background:#fff;color:#24334d;cursor:pointer;box-shadow:0 6px 12px #0003;transition:.2s}.choice:hover{transform:translateY(-4px)}.icon{font-size:3rem}.panel{text-align:center;background:#ffffff20;border-radius:18px;padding:24px}.back,.btn{padding:11px 20px;border:0;border-radius:999px;font-weight:bold;cursor:pointer}.back{float:left;background:#fff;color:#333}.btn{margin:7px;background:#ffcb3b;color:#333}.secondary{background:#fff}.display{clear:both;padding-top:16px;font-size:clamp(2rem,6vw,3.4rem);font-weight:bold}.question{font-size:2rem;margin:22px;word-wrap:break-word}input{width:170px;padding:12px;border:0;border-radius:10px;font-size:1.1rem;text-align:center}.sign{font-size:2rem;width:100px}.objects{min-height:160px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:18px;border:3px dashed #fff9;border-radius:15px}.object{font-size:clamp(2rem,7vw,4rem)}.math-question{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:20px 0}.math-group{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;min-width:125px;max-width:280px;min-height:78px;padding:13px;background:#fffffff2;border:4px solid #ffcb3b;border-radius:15px;color:#24334d;font-size:2.2rem}.math-sign{font-size:2.4rem;font-weight:bold}.options{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}.option{text-transform:uppercase;min-width:130px;padding:14px;border:0;border-radius:14px;background:#fff;color:#24334d;font-weight:bold;cursor:pointer}.feedback{min-height:30px;font-weight:bold}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.stat{padding:9px 12px;border-radius:10px;background:#ffffff2b;font-weight:bold}.green{background:linear-gradient(135deg,#00c853,#b2ff59)}.red{background:linear-gradient(135deg,#d50000,#ff5252)}@media(max-width:500px){.app{padding:14px}.back{float:none}.btn{width:calc(100% - 14px)}}
</style>
</head>
<body><main class="app">
<section id="home" class="screen active"><header class="head"><h1>🎓 Kids Learning Games</h1><p>Choose a game to start!</p></header><div class="choices"><button class="choice" onclick="openGame('count')"><div class="icon">🍎</div><h2>Count Objects</h2><p>Count from 1 to 20.</p></button><button class="choice" onclick="openGame('before')"><div class="icon">🔢</div><h2>Before, After & Between</h2><p>Find the missing number.</p></button><button class="choice" onclick="openGame('words')"><div class="icon">🔤</div><h2>Number Words</h2><p>Choose the English name.</p></button><button class="choice" onclick="openGame('compare')"><div class="icon">⚖️</div><h2>Compare Numbers</h2><p>Enter &gt;, &lt; or =.</p></button><button class="choice" onclick="openGame('math')"><div class="icon">➕➖</div><h2>Object Math</h2><p>Add or subtract objects.</p></button></div></section>
<section id="count" class="screen"><div class="panel"><button class="back" onclick="home()">← Games</button><div class="display">🎯 Count Objects</div><p>Count the objects and enter the number.</p><div id="objects" class="objects"></div><input id="countInput" type="number" min="1" max="20" placeholder="Answer"><br><button class="btn" onclick="checkCount()">Check</button><button class="btn secondary" onclick="newCount()">New Task</button><p id="countFeedback" class="feedback"></p><div id="countStats" class="stats"></div></div></section>
<section id="before" class="screen"><div class="panel"><button class="back" onclick="home()">← Games</button><div id="beforeTitle" class="display"></div><div class="question"><span id="leftNumber">?</span> ➜ <span id="middleNumber"></span> ➜ <span id="rightNumber">?</span></div><input id="beforeInput" type="number" min="1" max="100" placeholder="Answer"><br><button class="btn" onclick="checkBefore()">Check</button><button class="btn secondary" onclick="newBefore()">New Question</button><p id="beforeFeedback" class="feedback"></p><div id="beforeStats" class="stats"></div></div></section>
<section id="words" class="screen"><div class="panel"><button class="back" onclick="home()">← Games</button><div class="display">🔤 Number Words</div><p>Choose the correct English word.</p><div id="shownNumber" class="display"></div><div id="wordOptions" class="options"></div><p id="wordFeedback" class="feedback"></p><div id="wordStats" class="stats"></div><button class="btn secondary" onclick="newWords()">New Question</button></div></section>
<section id="compare" class="screen"><div class="panel"><button class="back" onclick="home()">← Games</button><div class="display">⚖️ Compare Numbers</div><p>Enter &gt;, &lt; or =</p><div id="compareQuestion" class="question"></div><input id="compareInput" class="sign" maxlength="1" placeholder="Sign"><br><button class="btn" onclick="checkCompare()">Check</button><button class="btn secondary" onclick="newCompare()">New Question</button><p id="compareFeedback" class="feedback"></p><div id="compareStats" class="stats"></div></div></section>
<section id="math" class="screen"><div class="panel"><button class="back" onclick="home()">← Games</button><div class="display">➕➖ Object Math</div><p>Count both boxes and solve the question.</p><div id="mathQuestion" class="math-question"></div><input id="mathInput" type="number" min="0" placeholder="Answer"><br><button class="btn" onclick="checkMath()">Check</button><button class="btn secondary" onclick="newMath()">New Question</button><p id="mathFeedback" class="feedback"></p><div id="mathStats" class="stats"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const body=document.body;const icons=['🍎','🍌','🐶','⚽','⭐','🎈','🍓'];
function openGame(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');body.className='';if(id==='count')newCount();if(id==='before')newBefore();if(id==='words')newWords();if(id==='compare')newCompare();if(id==='math')newMath()}function home(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('home').classList.add('active');body.className=''}function result(ok){body.className=ok?'green':'red'}function stats(right,total){return `<span class="stat">Right: ${right}</span><span class="stat">Total: ${total}</span><span class="stat">Score: ${total?Math.round(right/total*100):0}%</span>`}
let countAnswer=0,countRight=0,countTotal=0,countDone=false;function newCount(){countDone=false;countAnswer=Math.floor(Math.random()*20)+1;$('objects').innerHTML='';$('countInput').value='';$('countFeedback').textContent='';let icon=icons[Math.floor(Math.random()*icons.length)];for(let i=0;i<countAnswer;i++)$('objects').innerHTML+=`<span class="object">${icon}</span>`;$('countStats').innerHTML=stats(countRight,countTotal)}function checkCount(){if(countDone)return;if(!$('countInput').value){$('countFeedback').textContent='Please enter a number.';return}countDone=true;countTotal++;let ok=Number($('countInput').value)===countAnswer;if(ok){countRight++;$('countFeedback').textContent='Correct! 🎉'}else $('countFeedback').textContent='Correct answer: '+countAnswer;result(ok);$('countStats').innerHTML=stats(countRight,countTotal)}
let beforeAnswer=0,beforeRight=0,beforeTotal=0,beforeDone=false,mode='';function newBefore(){beforeDone=false;let n=Math.floor(Math.random()*96)+3;mode=['Before','After','Between'][Math.floor(Math.random()*3)];beforeAnswer=mode==='Before'?n-1:mode==='After'?n+1:n;$('beforeTitle').textContent='What number comes '+mode.toUpperCase()+'?';$('leftNumber').textContent=mode==='Before'?'?':mode==='Between'?n-1:n;$('middleNumber').textContent=mode==='Between'?'?':'';$('rightNumber').textContent=mode==='After'?'?':mode==='Between'?n+1:n;$('beforeInput').value='';$('beforeFeedback').textContent='';$('beforeStats').innerHTML=stats(beforeRight,beforeTotal)}function checkBefore(){if(beforeDone)return;if(!$('beforeInput').value){$('beforeFeedback').textContent='Please enter a number.';return}beforeDone=true;beforeTotal++;let ok=Number($('beforeInput').value)===beforeAnswer;if(ok){beforeRight++;$('beforeFeedback').textContent='Correct! 🎉'}else $('beforeFeedback').textContent='Correct answer: '+beforeAnswer;result(ok);$('beforeStats').innerHTML=stats(beforeRight,beforeTotal)}
const names=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty','twenty-one','twenty-two','twenty-three','twenty-four','twenty-five','twenty-six','twenty-seven','twenty-eight','twenty-nine','thirty','thirty-one','thirty-two','thirty-three','thirty-four','thirty-five','thirty-six','thirty-seven','thirty-eight','thirty-nine','forty','forty-one','forty-two','forty-three','forty-four','forty-five','forty-six','forty-seven','forty-eight','forty-nine','fifty'];let wordNumber=0,wordRight=0,wordTotal=0,wordDone=false;function newWords(){wordDone=false;wordNumber=Math.floor(Math.random()*50)+1;$('shownNumber').textContent=wordNumber;let options=[names[wordNumber]],used=new Set([wordNumber]);while(options.length<3){let n=Math.floor(Math.random()*50)+1;if(!used.has(n)){used.add(n);options.push(names[n])}}options.sort(()=>Math.random()-.5);$('wordOptions').innerHTML=options.map(x=>`<button class="option" onclick="checkWords(this)">${x}</button>`).join('');$('wordFeedback').textContent='Choose one answer.';$('wordStats').innerHTML=stats(wordRight,wordTotal)}function checkWords(button){if(wordDone)return;wordDone=true;wordTotal++;let ok=button.textContent===names[wordNumber];if(ok){wordRight++;button.style.background='#8cff9b';$('wordFeedback').textContent='Correct! 🎉'}else{button.style.background='#ff8c8c';$('wordFeedback').textContent='Correct answer: '+names[wordNumber]}result(ok);$('wordStats').innerHTML=stats(wordRight,wordTotal)}
let firstNumber=0,secondNumber=0,correctSign='',compareRightCount=0,compareTotalCount=0,compareDone=false;function newCompare(){compareDone=false;firstNumber=Math.floor(Math.random()*50)+1;secondNumber=Math.floor(Math.random()*50)+1;correctSign=firstNumber>secondNumber?'>':firstNumber<secondNumber?'<':'=';$('compareQuestion').innerHTML=`${firstNumber} &nbsp; ? &nbsp; ${secondNumber}`;$('compareInput').value='';$('compareFeedback').textContent='';$('compareStats').innerHTML=stats(compareRightCount,compareTotalCount)}function checkCompare(){if(compareDone)return;let value=$('compareInput').value.trim();if(!['>','<','='].includes(value)){$('compareFeedback').textContent='Enter only >, < or =';return}compareDone=true;compareTotalCount++;let ok=value===correctSign;if(ok){compareRightCount++;$('compareFeedback').textContent='Correct! 🎉'}else $('compareFeedback').textContent='Correct sign: '+correctSign;result(ok);$('compareStats').innerHTML=stats(compareRightCount,compareTotalCount)}
let firstObjects=0,secondObjects=0,mathAnswer=0,mathSign='',mathRight=0,mathTotal=0,mathDone=false;function newMath(){mathDone=false;mathSign=Math.random()<.5?'+':'-';firstObjects=Math.floor(Math.random()*10)+1;secondObjects=mathSign==='+'?Math.floor(Math.random()*10)+1:Math.floor(Math.random()*firstObjects)+1;mathAnswer=mathSign==='+'?firstObjects+secondObjects:firstObjects-secondObjects;let icon=icons[Math.floor(Math.random()*icons.length)];$('mathQuestion').innerHTML=`<span class="math-group">${Array(firstObjects).fill(icon).join(' ')}</span><span class="math-sign">${mathSign}</span><span class="math-group">${Array(secondObjects).fill(icon).join(' ')}</span><span class="math-sign">= ?</span>`;$('mathInput').value='';$('mathFeedback').textContent='';$('mathStats').innerHTML=stats(mathRight,mathTotal)}function checkMath(){if(mathDone)return;if($('mathInput').value===''){$('mathFeedback').textContent='Please enter your answer.';return}mathDone=true;mathTotal++;let ok=Number($('mathInput').value)===mathAnswer;if(ok){mathRight++;$('mathFeedback').textContent='Correct! Great maths! 🎉'}else $('mathFeedback').textContent='Correct answer: '+mathAnswer;result(ok);$('mathStats').innerHTML=stats(mathRight,mathTotal)}
</script></body></html>
