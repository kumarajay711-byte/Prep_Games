    body {

      padding: 1rem;
      color: #fff;
    }

      background: rgba(0, 0, 0, 0.15);

    }

    .number-display {
      font-size: 3rem;

      padding: 1rem 1.5rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.2);

    }

    .question-row {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.6rem;
      margin-top: 1rem;

    .controls {

      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

      border: none;
      cursor: pointer;

      font-weight: 600;
      min-width: 120px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
