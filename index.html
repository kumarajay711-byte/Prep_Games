<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kids Numbers Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      color: #fff;
    }

    .app-container {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 1.5rem;
      max-width: 900px;
      width: 100%;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1rem;
      opacity: 0.85;
    }

    /* Layout: mobile-first (single column) */
    .layout {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .game-panel {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .number-display {
      font-size: 4rem;
      font-weight: 700;
      padding: 1rem 2rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.2);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

    .btn {
      border: none;
      cursor: pointer;
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
      border-radius: 999px;
      background: #ffcb3b;
      color: #333;
      font-weight: 600;
      min-width: 120px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .btn-secondary {
      background: #ffffff;
      color: #333;
    }

    .stats-panel {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-size: 0.95rem;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stats-label {
      opacity: 0.9;
      font-weight: 500;
    }

    .stats-value {
      font-weight: 700;
    }

    .footer-note {
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    /* Tablet and small desktop: two columns */
    @media (min-width: 768px) {
      .app-container {
        padding: 2rem;
      }

      .header h1 {
        font-size: 2.4rem;
      }

      .header p {
        font-size: 1.1rem;
      }

      .layout {
        flex-direction: row;
        align-items: stretch;
      }

      .game-panel {
        flex: 2;
      }

      .stats-panel {
        flex: 1;
      }
    }

    /* Large desktop: bigger text and spacing */
    @media (min-width: 1200px) {
      .app-container {
        max-width: 1100px;
      }

      .number-display {
        font-size: 5rem;
      }

      .btn {
        font-size: 1.2rem;
        padding: 1rem 1.75rem;
      }

      .stats-panel {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>Kids Numbers Game</h1>
      <p>Tap to learn numbers, beat your best time!</p>
    </header>

    <main class="layout">
      <section class="game-panel">
        <div id="numberDisplay" class="number-display">1</div>

        <div class="controls">
          <button id="prevBtn" class="btn btn-secondary">Previous</button>
          <button id="nextBtn" class="btn">Next</button>
          <button id="randomBtn" class="btn btn-secondary">Random</button>
        </div>
      </section>

      <aside class="stats-panel">
        <div class="stats-row">
          <span class="stats-label">Current number</span>
          <span id="currentNumber" class="stats-value">1</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Attempts</span>
          <span id="attempts" class="stats-value">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Best time</span>
          <span id="bestTime" class="stats-value">–</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Last time</span>
          <span id="lastTime" class="stats-value">–</span>
        </div>
      </aside>
    </main>

    <div class="footer-note">
      Made with ❤️ for kids learning numbers.
    </div>
  </div>

  <!-- Load game logic -->
  <script src="game.js"></script>
</body>
</html>
